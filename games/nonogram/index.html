<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonogram - Picross Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="game-header">
            <h1>Nonogram</h1>
            <div id="controls">
                <div id="controls-row-top">
                    <div id="size-selector">
                        <button class="size-btn active" data-size="5">5&times;5</button>
                        <button class="size-btn" data-size="10">10&times;10</button>
                        <button class="size-btn" data-size="15">15&times;15</button>
                    </div>
                    <button id="new-game-btn">New Game</button>
                    <div id="lang-toggle" style="display:flex;gap:4px;align-items:center;margin-left:8px">
                        <button class="lang-btn" data-lang="tr" style="padding:2px 7px;font:bold 11px/1.4 sans-serif;border:1px solid rgba(0,0,0,.2);border-radius:4px;cursor:pointer;background:rgba(0,0,0,.08);color:inherit;opacity:.6">TR</button>
                        <button class="lang-btn" data-lang="en" style="padding:2px 7px;font:bold 11px/1.4 sans-serif;border:1px solid rgba(0,0,0,.2);border-radius:4px;cursor:pointer;background:rgba(0,0,0,.08);color:inherit;opacity:.6">EN</button>
                    </div>
                </div>
                <div id="controls-row-bottom">
                    <div id="timer-display">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span id="timer">00:00</span>
                    </div>
                    <div id="mistake-display">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        <span id="mistakes">0 / 5</span>
                    </div>
                    <button id="undo-btn" title="Undo (Ctrl+Z)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        Undo
                    </button>
                </div>
            </div>
        </header>

        <div id="board-wrapper">
            <div id="board-area">
                <!-- Corner spacer -->
                <div id="corner-spacer"></div>
                <!-- Column clues -->
                <div id="col-clues"></div>
                <!-- Row clues -->
                <div id="row-clues"></div>
                <!-- The grid -->
                <div id="grid"></div>
            </div>
        </div>

        <div id="win-overlay" class="hidden">
            <div id="win-modal">
                <h2>Puzzle Complete!</h2>
                <p id="win-time"></p>
                <p id="win-mistakes"></p>
                <button id="win-new-game">Play Again</button>
            </div>
        </div>

        <div id="game-over-overlay" class="hidden">
            <div id="game-over-modal">
                <h2>Game Over</h2>
                <p>You made too many mistakes!</p>
                <button id="game-over-new-game">Try Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
