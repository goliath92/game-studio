<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Solitaire</title>
    <link rel="stylesheet" href="../../fonts/fonts.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&text=一二三四五六七八九十萬東南西北中發梅蘭菊竹春夏秋冬麻將龍示洗新&display=swap">
    <link rel="stylesheet" href="mahjong-table-themes.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="mj-table" data-table-theme="cay-evi" data-tiles="retro">
    <div id="game-container">
        <!-- Top bar -->
        <div id="top-bar">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label" data-i18n="timer">Süre</span>
                    <span id="timer" class="stat-value">0:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-i18n="moves">Hamle</span>
                    <span id="move-counter" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-i18n="tiles">Taş</span>
                    <span id="tiles-remaining" class="stat-value">144</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-i18n="openPairs">Açık Çift</span>
                    <span id="open-pairs" class="stat-value">0</span>
                </div>
            </div>
            <div class="actions">
                <button id="btn-new-game" class="action-btn" aria-label="Yeni Oyun">
                    <span class="action-icon" aria-hidden="true">🆕</span>
                    <span class="action-text" data-i18n="newGame">Yeni Oyun</span>
                </button>
                <button id="btn-hint" class="action-btn" aria-label="İpucu">
                    <span class="action-icon" aria-hidden="true">💡</span>
                    <span class="action-text" data-i18n="hint">İpucu</span>
                </button>
                <button id="btn-shuffle" class="action-btn" aria-label="Karıştır">
                    <span class="action-icon" aria-hidden="true">🔀</span>
                    <span class="action-text" data-i18n="shuffle">Karıştır</span>
                </button>
                <button id="btn-settings" class="action-btn action-btn--icon" aria-label="Ayarlar">⚙</button>
            </div>
        </div>

        <!-- Settings panel (hidden by default) -->
        <div id="settings-panel" class="hidden">
            <div class="settings-section">
                <span class="settings-label" data-i18n="difficulty">Zorluk</span>
                <div class="settings-row">
                    <button class="diff-btn" data-diff="easy">Kolay</button>
                    <button class="diff-btn" data-diff="medium">Orta</button>
                    <button class="diff-btn is-active" data-diff="hard">Zor</button>
                </div>
            </div>
            <div class="settings-section">
                <span class="settings-label" data-i18n="theme">Tema</span>
                <div class="settings-row">
                    <button class="mj-swatch mj-swatch--fildisi" data-theme=""></button>
                    <button class="mj-swatch mj-swatch--bambu" data-theme="bambu"></button>
                    <button class="mj-swatch mj-swatch--retro" data-theme="retro"></button>
                    <button class="mj-swatch mj-swatch--bambu-retro" data-theme="bambu-retro"></button>
                </div>
            </div>
            <div class="settings-section">
                <span class="settings-label" data-i18n="table">Masa</span>
                <div class="settings-row">
                    <button class="table-theme-btn" data-table="cay-evi">☕</button>
                    <button class="table-theme-btn" data-table="tas-butonlar">🀄</button>
                    <button class="table-theme-btn" data-table="gece-kecesi">🌙</button>
                </div>
            </div>
        </div>

        <!-- Board area (felt) -->
        <div id="board-wrapper" class="mj-mat">
            <div id="board"></div>
        </div>

        <!-- Mobile bottom bar -->
        <div id="bottom-bar">
            <button id="btn-hint-mobile" class="action-btn" aria-label="İpucu">
                <span class="action-icon" aria-hidden="true">💡</span>
                <span class="action-text" data-i18n="hint">İpucu</span>
            </button>
            <button id="btn-shuffle-mobile" class="action-btn" aria-label="Karıştır">
                <span class="action-icon" aria-hidden="true">🔀</span>
                <span class="action-text" data-i18n="shuffle">Karıştır</span>
            </button>
            <button id="btn-settings-mobile" class="action-btn action-btn--icon" aria-label="Ayarlar">⚙</button>
            <button id="btn-new-mobile" class="action-btn" aria-label="Yeni Oyun">
                <span class="action-icon" aria-hidden="true">🆕</span>
                <span class="action-text" data-i18n="newGame">Yeni Oyun</span>
            </button>
        </div>

        <!-- Rotate hint for portrait mobile -->
        <div id="rotate-hint" class="hidden">
            <span class="rotate-icon" aria-hidden="true">↻</span>
            <span>Daha rahat oynamak için telefonu yan çevir</span>
            <button id="dismiss-rotate" aria-label="Kapat">✕</button>
        </div>

        <!-- Overlay (win/lose) -->
        <div id="overlay" class="hidden">
            <div id="overlay-content">
                <h2 id="overlay-title"></h2>
                <p id="overlay-message"></p>
                <div id="overlay-stats"></div>
                <button id="overlay-btn" class="new-game-btn" data-i18n="newGame">Yeni Oyun</button>
            </div>
        </div>

        <!-- Toast -->
        <div id="hint-toast" class="hidden"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
