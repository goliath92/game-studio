<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Mahjong Solitaire</title>
    <link rel="stylesheet" href="../../fonts/fonts.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&text=一二三四五六七八九十萬東南西北中發梅蘭菊竹春夏秋冬麻將龍示洗新&display=swap">
    <link rel="stylesheet" href="mahjong-table-themes.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="mj-table" data-table-theme="cay-evi" data-tiles="retro">
    <div id="game-container">
        <!-- Rotate warning (phone landscape) -->
        <div id="rotate-warning">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18h.01"/></svg>
            <p>Daha iyi oynamak için<br>telefonunu dikey çevir</p>
        </div>

        <!-- PORTRAIT: Stat strip -->
        <div id="stat-strip">
            <div class="sc"><span class="sc-label" data-i18n="timer">Süre</span><span class="sc-val" id="timer">0:00</span></div>
            <div class="sc"><span class="sc-label" data-i18n="moves">Hamle</span><span class="sc-val" id="move-counter">0</span></div>
            <div class="sc"><span class="sc-label" data-i18n="tiles">Taş</span><span class="sc-val" id="tiles-remaining">0</span></div>
            <div class="sc"><span class="sc-label" data-i18n="openPairs">Açık Çift</span><span class="sc-val" id="open-pairs">0</span></div>
        </div>

        <!-- LANDSCAPE: Side panel -->
        <aside id="side-panel">
            <div class="sp-stats">
                <div class="sc"><span class="sc-label">Süre</span><span class="sc-val" id="timer-s">0:00</span></div>
                <div class="sc"><span class="sc-label">Hamle</span><span class="sc-val" id="moves-s">0</span></div>
                <div class="sc"><span class="sc-label">Taş</span><span class="sc-val" id="tiles-s">0</span></div>
                <div class="sc"><span class="sc-label">Açık Çift</span><span class="sc-val" id="pairs-s">0</span></div>
            </div>
            <div class="sp-actions">
                <button class="sp-btn" id="btn-undo-s">
                    <svg viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 010 10h-4"/><path d="M7 6L3 10l4 4"/></svg>
                    <span>Geri Al</span><kbd>Z</kbd>
                </button>
                <button class="sp-btn" id="btn-hint-s">
                    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/><path d="M9 21h6"/></svg>
                    <span data-i18n="hint">İpucu</span><kbd>H</kbd>
                </button>
                <button class="sp-btn" id="btn-shuffle-s">
                    <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20L21 3M21 16v5h-5"/><path d="M15 15l6 6M4 4l5 5"/></svg>
                    <span data-i18n="shuffle">Karıştır</span><kbd>S</kbd>
                </button>
                <button class="sp-btn sp-btn--primary" id="btn-new-s">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
                    <span data-i18n="newGame">Yeni Oyun</span><kbd>N</kbd>
                </button>
            </div>
            <button class="sp-settings" id="btn-settings-s">
                <svg viewBox="0 0 24 24"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6M9 8h6M17 16h6"/></svg>
                <span data-i18n="settings">Ayarlar</span>
            </button>
        </aside>

        <!-- Board area (carpet) -->
        <div id="board-wrapper" class="mj-mat">
            <div id="board"></div>
        </div>

        <!-- PORTRAIT: Bottom action bar -->
        <div id="bottom-bar">
            <button class="bar-btn" id="btn-undo">
                <svg viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 010 10h-4"/><path d="M7 6L3 10l4 4"/></svg>
                <span>Geri Al</span>
            </button>
            <button class="bar-btn" id="btn-hint">
                <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/><path d="M9 21h6"/></svg>
                <span data-i18n="hint">İpucu</span>
            </button>
            <button class="bar-btn" id="btn-shuffle">
                <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20L21 3M21 16v5h-5"/><path d="M15 15l6 6M4 4l5 5"/></svg>
                <span data-i18n="shuffle">Karıştır</span>
            </button>
            <button class="bar-btn" id="btn-settings">
                <svg viewBox="0 0 24 24"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6M9 8h6M17 16h6"/></svg>
                <span data-i18n="settings">Ayarlar</span>
            </button>
            <button class="bar-btn bar-btn--primary" id="btn-new">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
                <span data-i18n="newGame">Yeni Oyun</span>
            </button>
        </div>

        <!-- Settings panel -->
        <div id="settings-panel" class="hidden">
            <div class="settings-section">
                <span class="settings-label" data-i18n="difficulty">Zorluk</span>
                <div class="settings-row">
                    <button class="diff-btn" data-diff="easy">Kolay</button>
                    <button class="diff-btn" data-diff="medium">Orta</button>
                    <button class="diff-btn is-active" data-diff="hard">Zor</button>
                </div>
            </div>
            <div class="settings-section">
                <span class="settings-label" data-i18n="theme">Tema</span>
                <div class="settings-row">
                    <button class="mj-swatch mj-swatch--fildisi" data-theme=""></button>
                    <button class="mj-swatch mj-swatch--bambu" data-theme="bambu"></button>
                    <button class="mj-swatch mj-swatch--retro" data-theme="retro"></button>
                    <button class="mj-swatch mj-swatch--bambu-retro" data-theme="bambu-retro"></button>
                </div>
            </div>
            <div class="settings-section">
                <span class="settings-label" data-i18n="table">Masa</span>
                <div class="settings-row">
                    <button class="table-theme-btn" data-table="cay-evi">☕</button>
                    <button class="table-theme-btn" data-table="tas-butonlar">🀄</button>
                    <button class="table-theme-btn" data-table="gece-kecesi">🌙</button>
                </div>
            </div>
        </div>

        <!-- Confirm dialog -->
        <div id="confirm-overlay" class="hidden">
            <div class="confirm-box">
                <p id="confirm-msg"></p>
                <div class="confirm-btns">
                    <button id="confirm-no">Vazgeç</button>
                    <button id="confirm-yes" class="confirm-yes">Evet</button>
                </div>
            </div>
        </div>

        <!-- Win/Lose overlay -->
        <div id="overlay" class="hidden">
            <div id="overlay-content">
                <h2 id="overlay-title"></h2>
                <p id="overlay-message"></p>
                <div id="overlay-stats"></div>
                <button id="overlay-btn" class="new-game-btn" data-i18n="newGame">Yeni Oyun</button>
            </div>
        </div>

        <!-- Toast -->
        <div id="hint-toast" class="hidden"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
